name: Release

on:
  push:
    tags:
    - '*.*.*'
permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify tag is on its release branch
      # A tag created from the GitHub Releases UI can land on the default branch instead of the selected one (#4620)
      run: |
        set -euo pipefail
        major="${GITHUB_REF_NAME#v}"
        major="${major%%.*}"
        if git ls-remote --exit-code --heads origin "release/${major}.x" > /dev/null; then
          branch="release/${major}.x"
        else
          branch="main"
        fi
        git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
        if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${branch}"; then
          echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on ${branch}. Delete the tag and recreate it on ${branch}."
          exit 1
        fi
        echo "Tag ${GITHUB_REF_NAME} is on ${branch}"
      shell: bash
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
    - name: Build and Test
      run: |
        dotnet build --configuration Release

        dotnet test --configuration Release --no-build --results-directory ".\artifacts" -l trx .\src\UnitTests

        dotnet test --configuration Release --no-build --results-directory ".\artifacts" -l trx .\src\AutoMapper.DI.Tests

      shell: pwsh
  build:
    needs: build-windows  
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}        
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
    - name: Install NuGetKeyVaultSignTool
      run: dotnet tool install --global NuGetKeyVaultSignTool
    - name: Build and Test
      run: ./Build.ps1
      shell: pwsh
    - name: Sign packages
      run: |-
        foreach ($f in Get-ChildItem "./artifacts" -Filter "*.nupkg") {
          NuGetKeyVaultSignTool sign $f.FullName --file-digest sha256 --timestamp-rfc3161 http://timestamp.digicert.com --azure-key-vault-managed-identity --azure-key-vault-url ${{ secrets.AZURE_KEYVAULT_URI }} --azure-key-vault-certificate ${{ secrets.CODESIGN_CERT_NAME }}
        }
      shell: pwsh
    - name: Push to MyGet
      env:
        NUGET_URL: https://f.feedz.io/lucky-penny-software/automapper/nuget/index.json
        NUGET_API_KEY: ${{ secrets.FEEDZIO_ACCESS_TOKEN }}
      run: ./Push.ps1
      shell: pwsh
    - name: Push to NuGet
      env:
        NUGET_URL: https://api.nuget.org/v3/index.json
        NUGET_API_KEY: ${{ secrets.AUTOMAPPER_NUGET_API_KEY }}
      run: ./Push.ps1
      shell: pwsh
    - name: Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: artifacts/**/*